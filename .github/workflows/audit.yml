name: audit

# Dependency advisories live in their own workflow ON PURPOSE, like `links` and
# `e2e`: the deploy workflow's `validate` gate is what blocks a release, and an
# advisory published against a lint tool at 3am must never be what stops a fix
# from shipping. A red run here is a signal to investigate, not a blocked
# release. `npm audit` is deliberately absent from validate.sh and the `validate`
# job for the same reason.
#
# This does not replace Dependabot, which still opens the fixing PR. It adds the
# two things Dependabot alerts don't give you: a check on the pull request that
# changes the dependency tree, and a result visible in the Actions tab rather
# than only in email and the Security tab.
on:
  pull_request:
    # Only what changes the dependency tree, so unrelated PRs don't hit the
    # registry. The weekly schedule still catches advisories published against a
    # tree that nobody touched.
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/audit.yml
  workflow_dispatch:
  schedule:
    # Mondays, an hour before `links`, so the two non-gating weekly workflows
    # don't contend for a runner at the same minute.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `cache: npm` and no `npm ci`: audit resolves the tree from
      # package-lock.json and queries the registry, so an install would be a
      # minute spent to learn nothing. The lockfile is the thing under audit.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"

      # The deployed site ships no dependencies at all, so this tree is empty
      # and this step passes for free. That is the point of keeping it: it is
      # the assertion that the tree is still empty. The day something lands in
      # `dependencies` it would be served to every visitor, and an advisory
      # against it stops being a tooling matter — so ANY severity fails here.
      - name: Runtime dependencies
        run: npm audit --omit=dev

      # Dev dependencies are soft: they are lint and test tooling that never
      # reaches a browser, and the only input they parse is what this repo
      # commits. Reported, never fatal — continue-on-error marks the step
      # without failing the run, so a lint-tool advisory reads as the low-stakes
      # thing it is instead of training everyone to ignore a red workflow.
      - name: Dev dependencies (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --include=dev

      # A one-line verdict in the run summary, so the result is legible from the
      # Actions list without opening the log.
      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Dependency audit"
            echo
            if npm audit --omit=dev >/dev/null 2>&1; then
              echo "Runtime dependencies: clean (the site ships none)."
            else
              echo "Runtime dependencies: **advisories found** — these ship to the browser."
            fi
            echo
            echo '```'
            npm audit --include=dev 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
