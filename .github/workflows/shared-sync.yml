name: shared-sync

# The five parsers in tools/shared/ are duplicated byte-for-byte in the sibling
# repo acurioustale/comparebuilds-app. tools/check-shared.mjs (on the gate) pins
# what this repo ships via tools/shared/MANIFEST.sha256, but a manifest can only
# see one repo: it cannot tell that a fix landed here and never reached there.
# This workflow is the other half — it diffs the two bundles and reports.
#
# NON-GATING, on purpose, like `links`, `audit` and `e2e`: the deploy workflow's
# `validate` job is what blocks a release, and a sibling that has not yet
# mirrored a change must never be what stops a fix from shipping here. A red run
# here is a signal to go mirror the change, not a blocked release.
on:
  push:
    branches: [main]
    # Only when the bundle itself moves — that is the moment the sibling is known
    # to be behind. The weekly schedule catches the reverse case, a change made
    # over there and never brought back, which no push here would notice.
    paths:
      - tools/shared/**
      - .github/workflows/shared-sync.yml
  workflow_dispatch:
  schedule:
    # Mondays, 07:00 UTC — an hour after `links` (06:00) and two after `audit`
    # (05:00), so the non-gating weeklies don't contend for a runner.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The sibling may well be private, in which case an unauthenticated clone
      # fails with a bare "repository not found" that reads like the repo was
      # renamed or deleted. Decide up front whether a token is available and say
      # so plainly, so a missing secret is an obvious skip rather than ten
      # minutes spent debugging a clone error. A fine-grained, read-only
      # (Contents: read) PAT scoped to the sibling is all this needs.
      - name: Check for the sibling read token
        id: token
        env:
          SHARED_SYNC_TOKEN: ${{ secrets.SHARED_SYNC_TOKEN }}
        run: |
          if [[ -n "$SHARED_SYNC_TOKEN" ]]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=shared-sync skipped::No SHARED_SYNC_TOKEN secret is set, so the sibling bundle cannot be fetched. Add a fine-grained read-only PAT for acurioustale/comparebuilds-app as SHARED_SYNC_TOKEN to enable the cross-repo diff."
          fi

      # Shallow and sparse: only tools/shared/ at only the tip commit, so this
      # costs a few kilobytes rather than the sibling's whole history.
      - name: Fetch the sibling bundle
        if: steps.token.outputs.available == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
          SHARED_SYNC_TOKEN: ${{ secrets.SHARED_SYNC_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:$SHARED_SYNC_TOKEN@github.com/acurioustale/comparebuilds-app.git" \
            sibling
          git -C sibling sparse-checkout set tools/shared

      # The verdict. `diff -ru` over the two directories catches a changed file,
      # a file present on one side only, and a file added to one bundle and not
      # the other — which is the whole question being asked. Printed in full, so
      # the log is enough to mirror the change without cloning anything by hand.
      - name: Diff the bundles
        if: steps.token.outputs.available == 'true'
        id: diff
        run: |
          if diff -ru tools/shared sibling/tools/shared >drift.txt; then
            echo "drift=false" >>"$GITHUB_OUTPUT"
            echo "The two bundles are identical."
          else
            echo "drift=true" >>"$GITHUB_OUTPUT"
            echo "The two bundles have DRIFTED:"
            cat drift.txt
          fi

      # A one-line verdict in the run summary, like `audit`, so the result is
      # legible from the Actions list without opening the log.
      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Shared bundle sync"
            echo
            if [[ "${{ steps.token.outputs.available }}" != "true" ]]; then
              echo "Skipped: no \`SHARED_SYNC_TOKEN\` secret, so acurioustale/comparebuilds-app could not be read."
            elif [[ "${{ steps.diff.outputs.drift }}" == "false" ]]; then
              echo "\`tools/shared/\` is identical in acurioustale/comparebuilds-app."
            else
              echo "\`tools/shared/\` has **drifted** from acurioustale/comparebuilds-app — mirror the change."
              echo
              echo '```diff'
              cat drift.txt
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # Fail last, after the summary is written, so the verdict is recorded even
      # on a red run. Non-gating: this reddens only this workflow.
      - name: Fail on drift
        if: steps.diff.outputs.drift == 'true'
        run: |
          echo "::error title=Shared bundle drift::tools/shared/ differs from acurioustale/comparebuilds-app. A fix to a shared parser has to land in BOTH repos."
          exit 1
