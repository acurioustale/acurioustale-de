version: 2

updates:
  # Security updates run from the repo's security settings and need no entry
  # here; this file adds the routine version updates on top, so a dependency is
  # bumped because it moved, not only once it turns into an advisory.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # `build` is this repo's type for dependency and pinning changes, so the
    # generated header is already a valid Conventional Commit: PRs squash-merge,
    # which makes the PR title the landed commit header.
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    open-pull-requests-limit: 5
    groups:
      # Lockstep pairs, listed first so they win for these packages: Dependabot
      # puts a dependency in the first group it matches. Each of these config
      # packages declares a peerDependency on its linter's major (`@eslint/js`
      # on `eslint ^10`, `stylelint-config-standard` on `stylelint ^17`), so a
      # PR bumping one across a major without the other can never go green.
      # Neither group carries an update-types filter, and that is the point:
      # majors are exactly the case that has to move together.
      #
      # The patterns are exact names, not prefixes. `@eslint/json` and
      # `eslint-plugin-html` declare no such constraint, so they stay in the
      # batch below where the gate catches a bad bump.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      stylelint:
        patterns:
          - stylelint
          - stylelint-config-standard
      # Every remaining npm dependency here is dev tooling — the deployed site
      # ships none — so there is no runtime tree to keep in separate PRs, unlike
      # repos that bundle their dependencies. The gate (lint, tests, coverage,
      # the four guards, svgo output) runs on each PR and catches a bad bump, so
      # batching minor and patch into one weekly PR trades no safety for much
      # less noise.
      # Majors stay on their own: markdownlint-cli2 has carried breaking changes
      # that need reading about, not just a green tick.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
